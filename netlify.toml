# Chuyển hướng mọi request bắt đầu bằng /api/ vào thư mục functions ngầm
#[[redirects]]
#  from = "/api/*"
#  to = "/.netlify/functions/:splat"
#  status = 200



# 1. Luồng đi vào Identity Service
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200

# 2. Luồng đi vào Core Service
[[redirects]]
  from = "/api/todos/*"
  to = "/.netlify/functions/todos"
  status = 200

# 3. Luồng đi vào Report Service
[[redirects]]
  from = "/api/stats/*"
  to = "/.netlify/functions/stats"
  status = 200